<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ස්තිතිය | ස්ටාෆ් කළමනාකරණ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="container">
      <a href="dashboard.html" class="logo">📊 සිටින්න කළමනාකරණ</a>
      <ul class="nav-links">
        <li><a href="dashboard.html">ඩැශබෝර්ඩ්</a></li>
        <li><a href="employees.html">සිටින්නා</a></li>
        <li><a href="departments.html">පිරිවු</a></li>
        <li><a href="roles.html">කාර්යභාරය</a></li>
        <li><a href="attendance.html" class="active">ස්තිතිය</a></li>
      </ul>
      <div class="user-menu">
        <span id="userName" style="color: var(--text); font-weight: 600;"></span>
        <button id="logoutBtn" class="logout-btn">ඉවත් වන්න</button>
      </div>
    </nav>
  </header>

  <div class="page-container">
    <div class="container">
      <h1 class="page-title">ස්තිතිය කළමනාකරණ</h1>

      <div class="actions">
        <input type="date" id="dateFilter">
        <button class="btn btn-primary" onclick="document.getElementById('addModal').classList.add('active')">+ ස්තිතිය සටහන් කරන්න</button>
      </div>

      <div class="card">
        <div class="table-container">
          <table id="dataTable">
            <thead>
              <tr>
                <th>සිතින්නා</th>
                <th>දිනය</th>
                <th>පිවිසුම්</th>
                <th>පිටවීම්</th>
                <th>පැවැත්වූ පැයි</th>
                <th>ස්තිතිය</th>
                <th>ක්‍රියාවන්</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="7" style="text-align: center;">පූරණය වෙමින්...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-content">
      <button class="modal-close" onclick="document.getElementById('addModal').classList.remove('active')">&times;</button>
      <div class="modal-header">ස්තිතිය සටහන් කරන්න</div>
      <form id="dataForm">
        <div class="form-group">
          <label for="employeeId">සිතින්නා</label>
          <select id="employeeId" required></select>
        </div>
        <div class="form-group">
          <label for="date">දිනය</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label for="status">ස්තිතිය</label>
          <select id="status" required>
            <option>අවස්තිතිය</option>
            <option>හිටිනවා</option>
            <option>අඩු දිනපතා</option>
            <option>ছুටි</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('addModal').classList.remove('active')">අවලංගු</button>
          <button type="submit" class="btn btn-primary">සටහන් කරන්න</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, attendanceAPI, employeeAPI, showAlert } from './api.js';

    if (!auth.isAuthenticated()) window.location.href = 'login.html';

    async function loadData() {
      try {
        const date = document.getElementById('dateFilter').value || new Date().toISOString().split('T')[0];
        const response = await attendanceAPI.getByDate(date);
        const tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';

        if (response.data && response.data.length > 0) {
          response.data.forEach(item => {
            tbody.innerHTML += `
              <tr>
                <td>${item.employee_id}</td>
                <td>${item.date}</td>
                <td>${item.check_in || 'N/A'}</td>
                <td>${item.check_out || 'N/A'}</td>
                <td>${item.hours_worked || 'N/A'}</td>
                <td><span class="badge badge-success">${item.status}</span></td>
                <td>
                  <button class="btn btn-danger btn-small" onclick="deleteItem('${item.id}')">මකා දමන්න</button>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">දත්ත නැත</td></tr>';
        }
      } catch (error) {
        showAlert('දත්ත පූරණය අසාර්ථක', 'error');
      }
    }

    async function loadEmployees() {
      try {
        const response = await employeeAPI.getAll();
        const select = document.getElementById('employeeId');
        select.innerHTML = '';
        
        if (response.data.data && response.data.data.length > 0) {
          response.data.data.forEach(emp => {
            const option = document.createElement('option');
            option.value = emp.id;
            option.textContent = `${emp.first_name} ${emp.last_name}`;
            select.appendChild(option);
          });
        }
      } catch (error) {
        showAlert('සිතින්නා පූරණය අසාර්ථක', 'error');
      }
    }

    document.getElementById('dataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await attendanceAPI.markAbsent(
          document.getElementById('employeeId').value,
          document.getElementById('date').value
        );
        showAlert('සටහන් කරපිනි!', 'success');
        document.getElementById('addModal').classList.remove('active');
        document.getElementById('dataForm').reset();
        loadData();
      } catch (error) {
        showAlert('පිසිබු අසාර්ථක විය', 'error');
      }
    });

    window.deleteItem = async (id) => {
      if (confirm('මකා දමන්න ඔබට නිශ්චිතද?')) {
        try {
          showAlert('මකා දැමුවා', 'success');
          loadData();
        } catch (error) {
          showAlert('මකා දැමීම අසාර්ථක විය', 'error');
        }
      }
    };

    document.getElementById('dateFilter').addEventListener('change', loadData);

    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.removeToken();
      window.location.href = 'login.html';
    });

    loadEmployees();
    loadData();
  </script>
</body>
</html>
