<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>සිටින්නා | ස්ටාෆ් කළමනාකරණ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <header>
    <nav class="container">
      <a href="dashboard.html" class="logo">📊 සිටින්න කළමනාකරණ</a>
      
      <ul class="nav-links">
        <li><a href="dashboard.html">ඩැශබෝර්ඩ්</a></li>
        <li><a href="employees.html" class="active">සිටින්නා</a></li>
        <li><a href="departments.html">පිරිවු</a></li>
        <li><a href="roles.html">කාර්යභාරය</a></li>
        <li><a href="attendance.html">ස්තිතිය</a></li>
      </ul>

      <div class="user-menu">
        <span id="userName" style="color: var(--text); font-weight: 600;"></span>
        <button id="logoutBtn" class="logout-btn">ඉවත් වන්න</button>
      </div>
    </nav>
  </header>

  <!-- Page Content -->
  <div class="page-container">
    <div class="container">
      <h1 class="page-title">සිටින්නා කළමනාකරණ</h1>

      <!-- Actions -->
      <div class="actions">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="නම, ඊ-තැපෙල් හෝ ෆොන් යෙන් සෙවීම...">
        </div>
        <button class="btn btn-primary" onclick="document.getElementById('addEmployeeModal').classList.add('active')">
          + නව සිටින්නා එක්කරුණු
        </button>
      </div>

      <!-- Employees Table -->
      <div class="card">
        <div class="table-container">
          <table id="employeesTable">
            <thead>
              <tr>
                <th>නම</th>
                <th>ඊ-තැපෙල්</th>
                <th>ෆොන්</th>
                <th>පිරිවුව</th>
                <th>කාර්යභාරය</th>
                <th>සල්ලි</th>
                <th>ස්තිතිය</th>
                <th>ක්‍රියාවන්</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="8" style="text-align: center; color: var(--text-muted);">
                  <div class="loading"></div> පූරණය වෙමින්...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="addEmployeeModal">
    <div class="modal-content">
      <button class="modal-close" onclick="document.getElementById('addEmployeeModal').classList.remove('active')">&times;</button>
      <div class="modal-header">සිටින්නා එක්කරගන්න</div>
      
      <form id="employeeForm">
        <div class="form-group">
          <label for="firstName">පළමු නම</label>
          <input type="text" id="firstName" required>
        </div>

        <div class="form-group">
          <label for="lastName">අන්තිම නම</label>
          <input type="text" id="lastName" required>
        </div>

        <div class="form-group">
          <label for="email">ඊ-තැපෙල්</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="phone">ෆොන්</label>
          <input type="tel" id="phone">
        </div>

        <div class="form-group">
          <label for="hireDate">බඳවා ගැනීමේ දිනය</label>
          <input type="date" id="hireDate" required>
        </div>

        <div class="form-group">
          <label for="salary">සල්ලි</label>
          <input type="number" id="salary" required>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('addEmployeeModal').classList.remove('active')">
            අවලංගු කරන්න
          </button>
          <button type="submit" class="btn btn-primary">සිටින්නා එක්කරගන්න</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, employeeAPI, showAlert } from './api.js';

    if (!auth.isAuthenticated()) {
      window.location.href = 'login.html';
    }

    // Load employees
    async function loadEmployees() {
      try {
        const response = await employeeAPI.getAll();
        const tbody = document.querySelector('#employeesTable tbody');
        tbody.innerHTML = '';

        if (response.data.data && response.data.data.length > 0) {
          response.data.data.forEach(emp => {
            tbody.innerHTML += `
              <tr>
                <td>${emp.first_name} ${emp.last_name}</td>
                <td>${emp.email}</td>
                <td>${emp.phone || 'N/A'}</td>
                <td>${emp.departments?.name || 'N/A'}</td>
                <td>${emp.roles?.title || 'N/A'}</td>
                <td>Rs. ${emp.salary}</td>
                <td><span class="badge ${emp.is_active ? 'badge-success' : 'badge-danger'}">${emp.is_active ? 'ක්‍රිය' : 'අක්‍රිය'}</span></td>
                <td>
                  <button class="btn btn-primary btn-small" onclick="editEmployee('${emp.id}')">සංස්කරණ</button>
                  <button class="btn btn-danger btn-small" onclick="deleteEmployee('${emp.id}')">මකා දමන්න</button>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">සිටින්නා නැත</td></tr>';
        }
      } catch (error) {
        showAlert('සිටින්නා පූරණය කිරීම අසාර්ථක විය', 'error');
      }
    }

    // Add employee
    document.getElementById('employeeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      try {
        const data = {
          first_name: document.getElementById('firstName').value,
          last_name: document.getElementById('lastName').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          hire_date: document.getElementById('hireDate').value,
          salary: parseFloat(document.getElementById('salary').value)
        };

        await employeeAPI.create(data);
        showAlert('සිටින්නා එක්කරගතා!', 'success');
        document.getElementById('addEmployeeModal').classList.remove('active');
        document.getElementById('employeeForm').reset();
        loadEmployees();
      } catch (error) {
        showAlert(error.message || 'සිටින්නා එක්කිරීම අසාර්ථක විය', 'error');
      }
    });

    // Delete employee
    window.deleteEmployee = async (id) => {
      if (confirm('මෙම සිටින්නා මකා දමන්න ඔබට නිශ්චිතද?')) {
        try {
          await employeeAPI.delete(id);
          showAlert('සිටින්නා මකා දැමුවා', 'success');
          loadEmployees();
        } catch (error) {
          showAlert('මකා දැමීම අසාර්ථක විය', 'error');
        }
      }
    };

    // Edit employee
    window.editEmployee = (id) => {
      showAlert('සංස්කරණ අවස්ථාව තවම අඩිසිටගෙන ඇත', 'info');
    };

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const rows = document.querySelectorAll('#employeesTable tbody tr');
      rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(searchTerm) ? '' : 'none';
      });
    });

    // Load user
    async function loadUserProfile() {
      try {
        const profile = await authAPI.getProfile();
        document.getElementById('userName').textContent = profile.data.name || 'පරිශීලක';
      } catch (error) {
        console.error('Profile loading failed:', error);
      }
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      auth.removeToken();
      window.location.href = 'login.html';
    });

    loadEmployees();
  </script>
</body>
</html>
